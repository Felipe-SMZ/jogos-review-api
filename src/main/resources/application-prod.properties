# Banco de dados — virão das variáveis de ambiente do Railway
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA/Hibernate — validate garante que o schema bate com as entidades sem alterar nada
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Segurança — obrigatório definir no Railway, sem fallback intencional
api.security.token.secret=${JWT_SECRET}

# Admin Seeder
admin.email=${ADMIN_EMAIL}
admin.senha=${ADMIN_SENHA}

# Actuator
management.endpoints.web.exposure.include=health

# IGDB — obrigatório definir no Railway, sem fallback intencional
igdb.client-id=${IGDB_CLIENT_ID}
igdb.client-secret=${IGDB_CLIENT_SECRET}